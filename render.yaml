services:
  - type: web
    name: stock-market-analyzer
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DISABLE_YFINANCE
        value: "true"
      - key: INDIAN_API_BASE_URL
        value: https://stock.indianapi.in
      - key: INDIAN_API_KEY
        sync: false
