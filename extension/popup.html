<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Market Analyzer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0c0e15;
      color: #d1d4dc;
      font-size: 13px;
      padding: 20px;
    }
    .header { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
    .header svg { flex-shrink: 0; }
    .header h1 { font-size: 16px; font-weight: 700; color: #fff; }
    .input-group { display: flex; gap: 6px; margin-bottom: 12px; }
    .input-group input {
      flex: 1; padding: 8px 12px; background: #1e222d; border: 1px solid #2a2e39;
      border-radius: 8px; color: #fff; font-size: 13px; outline: none;
    }
    .input-group input:focus { border-color: #5b5fc7; }
    .btn { padding: 8px 16px; background: #5b5fc7; color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; }
    .btn:hover { opacity: 0.85; }
    .btn-full { width: 100%; padding: 10px; margin-top: 8px; }
    .status { display: flex; align-items: center; gap: 6px; margin-bottom: 16px; font-size: 12px; color: #787b86; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #ef5350; }
    .dot.ok { background: #26a69a; }
    .divider { border: none; border-top: 1px solid #2a2e39; margin: 14px 0; }
    .hint { font-size: 12px; color: #4c525e; text-align: center; margin-top: 8px; line-height: 1.5; }
    .hint strong { color: #787b86; }
  </style>
</head>
<body>
  <div class="header">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3 17L9 11L13 15L21 7" stroke="#26a69a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 7H21V11" stroke="#26a69a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1>Stock Analyzer</h1>
  </div>

  <div class="status">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">Checking backend...</span>
  </div>

  <div class="input-group">
    <input type="text" id="symbolInput" placeholder="e.g. RELIANCE.NS, AAPL" spellcheck="false">
  </div>

  <button class="btn btn-full" id="openChartBtn">Open Chart Analyzer</button>

  <hr class="divider">

  <p class="hint">
    Opens the full chart UI at <strong>localhost:8899</strong> with candlestick chart, entry/exit markers, and analysis panel.
  </p>

  <script>
    const API = "http://localhost:8899";
    const dot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const symbolInput = document.getElementById("symbolInput");

    fetch(`${API}/api/health`).then(r => {
      if (r.ok) { dot.classList.add("ok"); statusText.textContent = "Backend connected"; }
    }).catch(() => { statusText.textContent = "Backend offline — start the server"; });

    document.getElementById("openChartBtn").addEventListener("click", () => {
      const symbol = symbolInput.value.trim();
      let url = API;
      if (symbol) url += `?symbol=${encodeURIComponent(symbol)}`;
      chrome.tabs.create({ url });
    });

    symbolInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("openChartBtn").click();
    });

    chrome.storage.local.get(["lastSymbol"], (d) => {
      if (d.lastSymbol) symbolInput.value = d.lastSymbol;
    });

    symbolInput.addEventListener("change", () => {
      chrome.storage.local.set({ lastSymbol: symbolInput.value.trim() });
    });
  </script>
</body>
</html>
